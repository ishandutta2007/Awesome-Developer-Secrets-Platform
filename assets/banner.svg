<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Node Animation Filters -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .bg-grid { opacity: 0.12; }
    .pulse-element { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
    .floating-card { animation: floatNode 6s ease-in-out infinite; }
    .banner-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .banner-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .banner-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Grid Accent -->
  <g class="bg-grid" stroke="#64748b" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M80 0 V320 M160 0 V320 M240 0 V320 M320 0 V320 M400 0 V320 M480 0 V320 M560 0 V320 M640 0 V320 M720 0 V320 M800 0 V320 M880 0 V320 M960 0 V320 M1040 0 V320 M1120 0 V320" />
  </g>

  <!-- Background Dynamic Glowing Orbs (Non-blocking) -->
  <circle cx="1050" cy="80" r="160" fill="url(#purple-glow)" filter="url(#glow-filter)" class="pulse-element" opacity="0.4" />
  <circle cx="150" cy="260" r="140" fill="url(#cyan-glow)" filter="url(#glow-filter)" class="pulse-element" opacity="0.3" />

  <!-- Animated Connection Pipelines (Right Side Decorative Element) -->
  <g opacity="0.5" class="floating-card">
    <!-- Pipeline Connections -->
    <path d="M 820 160 L 920 100 L 1040 100" stroke="#38bdf8" stroke-width="2" fill="none" class="flow-line" />
    <path d="M 820 160 L 920 220 L 1040 220" stroke="#c084fc" stroke-width="2" fill="none" class="flow-line" />
    <path d="M 820 160 L 1040 160" stroke="#818cf8" stroke-width="2" fill="none" class="flow-line" />

    <!-- Nodes -->
    <rect x="760" y="135" width="110" height="50" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="815" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Vault Core</text>

    <rect x="1010" y="75" width="120" height="45" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="1070" y="102" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">CI/CD Pipeline</text>

    <rect x="1010" y="138" width="120" height="45" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="1070" y="165" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">K8s Clusters</text>

    <rect x="1010" y="198" width="120" height="45" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <text x="1070" y="225" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Cloud Apps</text>
  </g>

  <!-- FOREGROUND TEXT & CONTENT (Unobstructed & Perfectly Readable) -->
  <g transform="translate(60, 0)">
    <!-- Security Tag Pill -->
    <rect x="0" y="52" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
    <text x="110" y="70" class="banner-tag" text-anchor="middle">🛡️ DEVSECOPS &amp; SECURITY</text>

    <!-- Main Title -->
    <text x="0" y="135" class="banner-title">Awesome Developer Secrets Platform</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="banner-subtitle">Curated Ecosystem of SaaS &amp; Open-Source Secrets Managers</text>
    <text x="0" y="208" class="banner-subtitle">Dynamic Credentials • Machine Identity • Zero-Trust Secrets Lifecycle</text>

    <!-- Feature Badges Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🔒 Secrets Vaults</text>

      <!-- Pill 2 -->
      <rect x="157" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="240" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a855f7" text-anchor="middle">⚡ Credential Rotation</text>

      <!-- Pill 3 -->
      <rect x="334" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="416" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">🌐 Cloud &amp; Self-Hosted</text>
    </g>
  </g>
</svg>
